<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="ad.orientation" content="portrait">
<title>EVA AI — Find Your Type</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="glow" class="abs fill"></div>

  <!-- the girl, steps 2 and 3: video layers in the source frame's pixels (1090 x 1920); game.js moves
       and scales this frame like a camera -->
  <div id="hero" class="abs"><div id="heroV" class="abs"></div></div>
  <div id="shadeTop" class="abs"></div>
  <div id="shadeBot" class="abs"></div>
  <div id="shadeSide" class="abs"></div>

  <div id="logo" class="abs"></div>

  <div id="title" class="abs"><div class="h"></div><div class="sub"></div></div>

  <!-- step 1: the two style cards (filled by game.js) -->
  <div id="cards" class="abs"></div>

  <!-- steps 2-3: her name -->
  <div id="pill" class="abs"><b class="nm"></b><i class="dot"></i><span class="role"></span></div>

  <!-- step 2: the four girls, with up / down buttons at the ends of the column -->
  <div id="thumbs" class="abs"></div>
  <div id="navUp" class="nav abs"><i></i></div>
  <div id="navDown" class="nav abs"><i></i></div>

  <!-- her messages -->
  <div id="chat" class="abs"></div>

  <div id="btn" class="btn off abs"><i class="r1"></i><i class="r2"></i><b class="core"><span class="shine"></span><span class="t"></span></b></div>

  <div id="fx" class="abs fill"></div>
</div>

<script src="fit.js"></script>
<script src="config.js"></script>
<script src="clips.js"></script>
<script src="ad.js"></script>
<script src="game.js"></script>
</body>
</html>
