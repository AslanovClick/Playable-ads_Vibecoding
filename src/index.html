<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="ad.orientation" content="portrait">
<title>EVA AI — Choose My Look</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <!-- video layers: game.js cross-fades between them -->
  <div id="videos" class="abs fill">
    <div id="poster" class="abs fill"></div>
    <video class="abs fill" muted playsinline webkit-playsinline preload="auto" disableremoteplayback></video>
    <video class="abs fill" muted playsinline webkit-playsinline preload="auto" disableremoteplayback></video>
    <video class="abs fill" muted playsinline webkit-playsinline preload="auto" disableremoteplayback></video>
    <video class="abs fill" muted playsinline webkit-playsinline preload="auto" disableremoteplayback></video>
  </div>
  <div id="shadeTop" class="abs"></div>
  <div id="shadeBot" class="abs"></div>

  <div id="logo" class="abs"></div>
  <div id="pill" class="abs"><b id="pillName"></b><i class="dot"></i><span id="pillRole"></span></div>
  <div id="title" class="abs"></div>

  <!-- chat messages, newest at the bottom -->
  <div id="chat" class="abs"></div>

  <!-- dress choice -->
  <div id="cards" class="abs"></div>
  <div id="wearBtn" class="btn small off abs"><i class="r1"></i><i class="r2"></i><b class="core"><span class="shine"></span><span class="t"></span></b></div>

  <!-- swipe guide along the zipper -->
  <div id="zip" class="abs">
    <i class="line"></i>
    <i class="ring r1"></i><i class="ring r2"></i>
    <i class="pull"></i>
    <svg class="arrow" viewBox="0 0 64 40"><path d="M6 6 L32 32 L58 6" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div id="hand" class="abs">
    <svg viewBox="0 0 120 150">
      <path class="skin" d="M44 4C36 4 32 10 32 17L32 72C26 66 14 64 9 72C5 79 9 88 15 94L30 112C34 130 46 142 66 142L88 142C102 142 110 132 110 116L110 80C110 73 106 70 101 70C96 70 92 73 92 78C92 66 88 62 83 62C78 62 74 65 74 70C74 60 70 56 65 56C60 56 56 60 56 66L56 17C56 10 52 4 44 4Z"/>
      <path class="crease" d="M56 66L56 82M74 70L74 86M92 78L92 92M32 72L36 90"/>
    </svg>
  </div>
  <!-- the zipper pull under the finger while swiping -->
  <div id="handle" class="abs"><i class="halo"></i><i class="core"></i></div>

  <!-- final chat -->
  <div id="cta" class="btn abs"><i class="r1"></i><i class="r2"></i><b class="core"><span class="shine"></span><span class="t"></span></b></div>

  <div id="fx" class="abs fill"></div>
  <div id="flash" class="abs fill"></div>
  <div id="cut" class="abs fill"></div>

  <div id="legal" class="abs"></div>
</div>

<script src="config.js"></script>
<script src="clips.js"></script>
<script src="ad.js"></script>
<script src="game.js"></script>
</body>
</html>
